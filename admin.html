<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Accesso Titolare — Giulia Beauty Studio</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="admin.css?v=11" />
</head>
<body>
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <img src="assets/logo-full.png" alt="Giulia Beauty Studio" class="login-logo" />
      <span class="eyebrow">Area Riservata Titolare</span>
      <h1>Agenda &amp; Database Clienti</h1>
      <p class="login-subtitle">Accedi per aprire l'agenda appuntamenti, promemoria WhatsApp, compleanni, note e consensi GDPR.</p>

      <div id="loginAlert" class="admin-alert admin-alert-error" hidden></div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="loginUsername">Username o Email</label>
          <input type="text" id="loginUsername" class="form-control" placeholder="es. giulia@giuliabeauty.it" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-primary-admin btn-full" id="loginSubmitBtn">
          Accedi e Apri l'Agenda →
        </button>
      </form>

      <div class="login-footer-links">
        <a href="index.html">← Torna alla Boutique Pubblica</a>
        <a href="api/setup">Prima configurazione DB</a>
      </div>
    </div>
  </section>

  <script src="gbs-loader.js?v=1"></script>
  <script src="catalog.js"></script>
  <script src="admin.js?v=13"></script>
</body>
</html>
